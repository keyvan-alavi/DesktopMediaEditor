name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure (debug)
        run: |
          echo "=== Current directory ==="
          cd
          echo "=== Root contents ==="
          dir
          echo "=== Looking for build.spec ==="
          dir /s /b build.spec 2>nul || echo "build.spec not found in any subdirectory"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Try both possible locations for requirements.txt
          if exist requirements.txt (
            pip install -r requirements.txt
          ) else if exist DesktopMediaEditor\requirements.txt (
            pip install -r DesktopMediaEditor\requirements.txt
          ) else (
            echo "requirements.txt not found"
            exit 1
          )
          pip install pyinstaller

      - name: Locate and run PyInstaller
        run: |
          # Prefer root, then common subfolder
          if exist build.spec (
            echo "Found build.spec in root"
            pyinstaller --noconfirm build.spec
          ) else if exist DesktopMediaEditor\build.spec (
            echo "Found build.spec inside DesktopMediaEditor/"
            cd DesktopMediaEditor
            pyinstaller --noconfirm build.spec
            # Move dist up so later steps find it
            if exist dist\DesktopMediaEditor.exe (
              mkdir ..\dist 2>nul
              move dist\DesktopMediaEditor.exe ..\dist\
            )
          ) else (
            echo "ERROR: build.spec not found in root or DesktopMediaEditor/"
            echo "Please make sure build.spec is committed to the repository."
            exit 1
          )

      - name: List output
        run: |
          echo "=== dist folder ==="
          dir dist 2>nul || echo "dist not found"
          dir /s /b *.exe 2>nul || echo "No exe found"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopMediaEditor-Windows
          path: |
            dist/DesktopMediaEditor.exe
            DesktopMediaEditor/dist/DesktopMediaEditor.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DesktopMediaEditor.exe
            DesktopMediaEditor/dist/DesktopMediaEditor.exe
          name: Desktop Media Editor ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
